# Catppuccin Mocha, matching kitty/waybar/hyprland borders. 2x the default
# font size and a wider window -- the keybind cheatsheet and other lists
# were unreadable small before this existed (fuzzel had no config at all).
[main]
font=JetBrainsMono Nerd Font:size=16
width=50
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=10

[colors]
background=1e1e2edd
text=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=89b4faff

[border]
width=2
radius=8
