# Tigerstripe Kitty Theme -- dark black/grey, same shape as alpenflage.conf.
# ANSI colors kept functionally distinct (red still reads as red, green as
# green) just desaturated toward grey rather than flattened to monochrome --
# error/diff colors would stop being useful otherwise.
