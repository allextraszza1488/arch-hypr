# BEGIN_KITTY_THEME
# Catppuccin-Mocha
# active-look.conf is a plain copy of whichever of looks/*.conf is active --
# toggle-look.sh overwrites it, kitty.conf itself never needs editing again.
# Existing kitty windows won't pick up a change live (needs Ctrl+Shift+F5
# per window); only freshly launched ones read this at startup.
include active-look.conf
# END_KITTY_THEME

font_size 16.0
term xterm-256color

enable_audio_bell no
window_padding_width 4
confirm_os_window_close 0 
